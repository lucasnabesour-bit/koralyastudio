name: Veille quotidienne Koralya

on:
  schedule:
    # Chaque jour à 08 h 15 en Martinique (UTC-4).
    - cron: '15 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - automation/sources.json
      - scripts/source_watch.py
      - scripts/site_monitor.py
      - .github/workflows/source-watch.yml
  pull_request:
    paths:
      - automation/sources.json
      - scripts/source_watch.py
      - tests/test_source_watch.py
      - .github/workflows/source-watch.yml

permissions:
  contents: read

concurrency:
  group: source-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683c9 # v4.2.2
        with:
          persist-credentials: false
      - name: Vérifier les contrôleurs
        run: python3 -m unittest discover -s tests -v
      - name: Collecter les flux officiels
        if: github.event_name != 'pull_request'
        run: python3 -m scripts.source_watch
      - name: Afficher la veille
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -f reports/veille.md ]; then
            cat reports/veille.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Conserver les résultats pendant 30 jours
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: veille-koralya-${{ github.run_id }}
          path: reports/veille.*
          retention-days: 30
          if-no-files-found: warn
