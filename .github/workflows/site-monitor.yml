name: Contrôle hebdomadaire Koralya

on:
  schedule:
    # Lundi à 08 h en Martinique (UTC-4).
    - cron: '0 12 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/site_monitor.py
      - tests/test_site_monitor.py
      - automation/**
      - .github/workflows/site-monitor.yml

permissions:
  contents: read

concurrency:
  group: site-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683c9 # v4.2.2
        with:
          persist-credentials: false
      - name: Vérifier le contrôleur
        run: python3 -m unittest discover -s tests -v
      - name: Contrôler les pages publiques
        if: github.event_name != 'pull_request'
        run: python3 scripts/site_monitor.py
      - name: Afficher le rapport
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -f reports/monitor.md ]; then
            cat reports/monitor.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Conserver le rapport pendant 30 jours
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controle-koralya-${{ github.run_id }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
